# Harder experiments. Not applied unless enabled: true.
hard_options:
  enabled: false
  weak_signal: false
  strong_noise: false
  small_affected_population: false
  unequal_lot_sizes: false
  unequal_equipment_utilization: false
  missing_optional_fields: false
  confounded_variables: false
  multiple_simultaneous_effects: false
