# V2 synthetic test catalog — display overlay only.
# Source of truth for each test is configs/synthetic_v2.yaml (test_id, sequence_index, failure_code).
# That generator file has no test_name field. These display names copy the generator
# program-slot failure_code so every T001–T010 has a distinct, non-invented label.
# They are not a real ATE program and are not a new physical test type.

catalog_id: yi_v2_test_catalog
catalog_version: yi_v2_test_catalog_v2
dataset_id: yi_synthetic_v2
source: SYNTHETIC_V2_GENERATOR_PROGRAM_SLOTS
note: >
  Display names copy tests[].failure_code from configs/synthetic_v2.yaml.
  The generator does not define a separate semantic test_name. Overlay names
  such as Functional Test or Unclassified V2 Test are not used.

tests:
  - test_id: T001
    test_name: CONTINUITY
    test_type: CONTINUITY
    description: V2 generator program slot T001 (sequence 1). FAIL rows store failure_code CONTINUITY.
    sequence_index: 1
    classified: false
    relevant_measurements: []

