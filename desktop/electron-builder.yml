appId: com.verilumen.ate
productName: Verilumen - ATE
copyright: Copyright © 2026 VERILUMEN
directories:
  output: dist
  buildResources: build
files:
  - electron/**
  - package.json
extraResources:
  - from: supervisor.py
    to: supervisor.py
  - from: static_proxy.js
    to: static_proxy.js
  # stage/ is a directory junction to the short build root (see build-windows.ps1);
  # electron-builder resolves these paths relative to the project dir, so they must stay relative.
  - from: stage/python
    to: python
  - from: stage/node
    to: node
  - from: stage/suite
    to: suite
asar: true
# normal = balanced size/install speed; store = fastest install, largest .exe
compression: normal
publish:
  provider: github
  owner: naveen-verilumen
  repo: verilumen-ate
  releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Verilumen-ATE-Setup-${version}.exe
  icon: build/icon.ico
  legalTrademarks: VERILUMEN
  # Windows code signing is automatically invoked if CSC_LINK and CSC_KEY_PASSWORD are set.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Verilumen - ATE
  uninstallDisplayName: Verilumen - ATE
  differentialPackage: true
